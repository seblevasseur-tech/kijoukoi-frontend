<div class="dashboard-page">
  <div class="dashboard-header">
    <h1>Tableau de bord</h1>
    <p class="subtitle">Statistiques globales sur le matériel des joueurs</p>
  </div>

  <div class="dashboard-content">
    
    <!-- Filtres -->
    <div class="filter-card">
      <div class="card-header">
        <h2>Filtres</h2>
        <p>Ajustez le classement pour voir la répartition des marques de bois.</p>
      </div>
      
      <div class="slider-container">
        <div class="label-group left">
          <span class="label-title">Points Min</span>
          <span class="label-value">{{ minElo }}</span>
        </div>
        
        <div class="range-slider">
          <div class="track-bg"></div>
          <div class="track-fill" #sliderTrack></div>
          <input 
            type="range" 
            [min]="minLimit" 
            [max]="maxLimit" 
            [(ngModel)]="minElo" 
            (input)="onSliderChange(true)" 
            class="thumb min-thumb">
          <input 
            type="range" 
            [min]="minLimit" 
            [max]="maxLimit" 
            [(ngModel)]="maxElo" 
            (input)="onSliderChange(false)" 
            class="thumb max-thumb">
        </div>

        <div class="label-group right">
          <span class="label-title">Points Max</span>
          <span class="label-value">{{ maxElo }}</span>
        </div>
      </div>

      <!-- Advanced Filters -->
      <div class="advanced-filters">
        <div class="filter-group">
          <label>Marque</label>
          <select [(ngModel)]="selectedBrandId" (change)="onFilterChange()">
            <option [ngValue]="null">Toutes</option>
            <option *ngFor="let b of brands" [value]="b.id">{{ b.name }}</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Modèle Bois</label>
          <select [(ngModel)]="selectedBladeId" (change)="onFilterChange()">
            <option [ngValue]="null">Tous</option>
            <option *ngFor="let b of blades" [value]="b.id">{{ b.name }}</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Revêtement CD</label>
          <select [(ngModel)]="selectedFhRubberId" (change)="onFilterChange()">
            <option [ngValue]="null">Tous</option>
            <option *ngFor="let r of rubbers" [value]="r.id">{{ r.name }}</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Revêtement RV</label>
          <select [(ngModel)]="selectedBhRubberId" (change)="onFilterChange()">
            <option [ngValue]="null">Tous</option>
            <option *ngFor="let r of rubbers" [value]="r.id">{{ r.name }}</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Étiquette (Tag)</label>
          <select [(ngModel)]="selectedTagId" (change)="onFilterChange()">
            <option [ngValue]="null">Tous</option>
            <option *ngFor="let t of tags" [value]="t.id">{{ t.name }}</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Output Selection & Graphique -->
    <div class="chart-section">
      <div class="chart-header">
        <div class="output-selector">
          <label for="outputSelect">Résultat à afficher :</label>
          <select id="outputSelect" [(ngModel)]="selectedOutput" (change)="onFilterChange()">
            <option *ngFor="let opt of outputOptions" [value]="opt.value">{{ opt.label }}</option>
          </select>
        </div>
      </div>
      <div class="chart-container">
        <canvas #brandChart></canvas>
        <div class="empty-state" *ngIf="!chartInstance?.data?.labels?.length">
          <p>Aucune donnée disponible pour ces critères.</p>
        </div>
      </div>
    </div>

  </div>
</div>

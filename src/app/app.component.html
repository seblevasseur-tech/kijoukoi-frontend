<div class="spotify-layout" [class.sidebar-collapsed]="isSidebarCollapsed">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" [class.is-collapsed]="isSidebarCollapsed">
        <div class="logo">
            <span class="icon">🏓</span>
            <button
                    type="button"
                    class="sidebar-toggle"
                    (click)="toggleSidebar()"
                    [attr.aria-label]="isSidebarCollapsed ? 'Déplier le menu' : 'Replier le menu'"
                    [attr.aria-expanded]="!isSidebarCollapsed"
            >
                {{ isSidebarCollapsed ? '▶' : '◀' }}
            </button>
        </div>

        <nav class="nav-menu">
            <a routerLink="/players" routerLinkActive="active" class="nav-item" (click)="closeSidebarOnMobile()">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c.4-3.2 2.5-5 6-5s5.6 1.8 6 5M14 15.5c2.9-.4 5.2 1.2 5.8 4.5"/></svg>
                <span class="nav-label">Joueurs</span>
            </a>

            <a routerLink="/blades" routerLinkActive="active" class="nav-item" (click)="closeSidebarOnMobile()">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9" cy="8" rx="5.5" ry="6" transform="rotate(-25 9 8)"/><path d="M11.5 12.5 18 20" stroke-width="3"/></svg>
                <span class="nav-label">Bois</span>
            </a>

            <a routerLink="/rubbers" routerLinkActive="active" class="nav-item" (click)="closeSidebarOnMobile()">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="15" rx="3"/><path d="M7 8h10M7 12h10M7 16h10"/><circle cx="8" cy="6" r=".7" fill="currentColor" stroke="none"/><circle cx="12" cy="6" r=".7" fill="currentColor" stroke="none"/><circle cx="16" cy="6" r=".7" fill="currentColor" stroke="none"/></svg>
                <span class="nav-label">Revêtements</span>
            </a>

            <div class="nav-section-title">Mon Espace</div>

            <a routerLink="/profile" routerLinkActive="active" class="nav-item" (click)="closeSidebarOnMobile()">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c.4-3.2 2.5-5 6-5s5.6 1.8 6 5M18 14v6M15 17h6"/></svg>
                <span class="nav-label">Mon Profil</span>
            </a>

            <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" (click)="closeSidebarOnMobile()">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
                <span class="nav-label">Tableau de bord</span>
            </a>
        </nav>

        <!-- Sidebar Bottom Auth/Profile section -->
        <div class="sidebar-profile">
            <ng-container *ngIf="currentUser()">
                <div class="user-profile-info">
                    <div class="user-avatar">{{ currentUser()?.login?.charAt(0) | uppercase }}</div>
                    <span class="user-name" *ngIf="!isSidebarCollapsed">{{ currentUser()?.login }}</span>
                    <button class="btn-logout-icon" (click)="logout()" title="Déconnexion" *ngIf="!isSidebarCollapsed">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                    <!-- Mobile / Collapsed mode logout -->
                    <button class="btn-logout-icon" (click)="logout()" title="Déconnexion" *ngIf="isSidebarCollapsed" style="margin-top: 12px; margin-left: 0;">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </ng-container>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <router-outlet></router-outlet>
    </main>
</div>

<!-- Global Toaster -->
<app-toast></app-toast>

<div class="add-blade-container">
  <div class="form-card">
    <h2 class="form-title">Ajouter un Bois</h2>
    <p class="form-subtitle">Renseignez les informations de ce nouveau modèle.</p>

    <form [formGroup]="bladeForm" (ngSubmit)="onSubmit()" class="blade-form">
      <!-- Ligne 1 : Nom et Marque -->
      <div class="form-row">
        <div class="form-group">
          <label for="name">Nom du modèle *</label>
          <input type="text" id="name" formControlName="name" placeholder="Ex: Viscaria" />
        </div>
        
        <div class="form-group">
          <label for="brandId">Marque *</label>
          <select id="brandId" formControlName="brandId">
            <option value="" disabled selected>Choisir une marque</option>
            <option *ngFor="let brand of brands" [value]="brand.id">{{ brand.name }}</option>
          </select>
        </div>
      </div>

      <!-- Ligne 2 : Poids et Type -->
      <div class="form-row">
        <div class="form-group">
          <label for="weight">Poids moyen (g) *</label>
          <input type="number" id="weight" formControlName="weight" placeholder="Ex: 85" min="20" max="200" />
        </div>
        
        <div class="form-group">
          <label for="typeId">Type de bois *</label>
          <select id="typeId" formControlName="typeId">
            <option value="" disabled selected>Choisir un type</option>
            <option *ngFor="let type of bladeTypes" [value]="type.id">{{ type.name }}</option>
          </select>
        </div>
      </div>

      <!-- Ligne 3 : Image -->
      <div class="form-row">
        <div class="form-group full-width image-upload-group">
          <label>Image (facultatif)</label>
          <div class="upload-area" [class.has-image]="imageBase64" (click)="fileInput.click()">
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/jpeg,image/png,image/webp" hidden>
            
            <div class="upload-placeholder" *ngIf="!imageBase64">
              <div class="icon">📷</div>
              <span>Cliquez pour parcourir ou glissez une image ici</span>
              <small>JPG, PNG, WEBP (Max 2MB)</small>
            </div>

            <div class="image-preview" *ngIf="imageBase64">
              <img [src]="imageBase64" alt="Aperçu">
              <div class="change-overlay">
                <span>Changer d'image</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="!bladeForm.valid">
          Ajouter le bois
        </button>
      </div>
    </form>
  </div>
</div>

<div class="list-section">
  <app-blade-list #bladeList></app-blade-list>
</div>

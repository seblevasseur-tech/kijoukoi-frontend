<div class="catalog-list-page">
  <h2>Liste des Joueurs</h2>
  <div class="players-grid" *ngIf="players.length > 0; else noPlayers">
    <a class="player-card" *ngFor="let player of players">
      <div class="card-avatar">
        <!-- Générateur d'avatar aléatoire basé sur le login si pas d'avatar -->
        <img [src]="player.avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + player.firstName + player.lastName" [alt]="player.firstName + ' ' + player.lastName" />
      </div>

      <div class="card-info">
        <h3 class="player-name">{{ player.firstName }} {{ player.lastName }}</h3>
        <p style="color: var(--color-text-secondary); margin-top: 4px; font-size: 0.9em;">Classement: {{ player.ranking }}</p>
        
        <div *ngIf="player.racket" style="margin-top: 12px; font-size: 0.85em; color: var(--color-text-secondary);">
          <div *ngIf="player.racket.blade">
            <strong>Bois:</strong> <span [ngStyle]="{'color': player.racket.blade.name === 'Matériel introuvable' ? '#ff4444' : 'inherit', 'font-weight': player.racket.blade.name === 'Matériel introuvable' ? 'bold' : 'normal'}">{{ player.racket.blade.name }}</span>
          </div>
          <div *ngIf="player.racket.forehandRubber">
            <strong>CD:</strong> <span [ngStyle]="{'color': player.racket.forehandRubber.name === 'Matériel introuvable' ? '#ff4444' : 'inherit', 'font-weight': player.racket.forehandRubber.name === 'Matériel introuvable' ? 'bold' : 'normal'}">{{ player.racket.forehandRubber.name }}</span>
          </div>
          <div *ngIf="player.racket.backhandRubber">
            <strong>RV:</strong> <span [ngStyle]="{'color': player.racket.backhandRubber.name === 'Matériel introuvable' ? '#ff4444' : 'inherit', 'font-weight': player.racket.backhandRubber.name === 'Matériel introuvable' ? 'bold' : 'normal'}">{{ player.racket.backhandRubber.name }}</span>
          </div>
        </div>
      </div>
    </a>
  </div>
  
  <ng-template #noPlayers>
      <p class="no-players">Aucun joueur enregistré pour le moment.</p>
  </ng-template>
</div>

<div class="catalog-list-page">
  <h2>Liste des Revêtements</h2>
  <div class="rubbers-grid" *ngIf="rubbers.length > 0; else noRubbers">
    <a class="rubber-card" *ngFor="let rubber of rubbers">
      <div class="card-avatar">
        <img [src]="apiUrl + '/equipment/rubbers/' + rubber.id + '/image'" [alt]="rubber.name" loading="lazy" />
      </div>

      <div class="card-info">
        <h3 class="rubber-brand">{{ rubber.brand.name }}</h3>
        <h3 class="rubber-name">{{ rubber.name }}</h3>
      </div>
    </a>
  </div>
  
  <ng-template #noRubbers>
      <p class="no-rubbers">Aucun revêtement enregistré pour le moment.</p>
  </ng-template>
</div>

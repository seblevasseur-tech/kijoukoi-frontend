<div class="login-page">
  <div class="login-container">
    
    <div class="yeti-wrapper" [class.hide-eyes]="isPasswordFocused">
      <svg class="yeti-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Dog Back / Head -->
        <circle cx="100" cy="110" r="75" fill="#E89B3F" />
        
        <!-- Ears -->
        <path d="M 30 50 L 60 90 L 70 50 Z" fill="#E89B3F" />
        <path d="M 170 50 L 140 90 L 130 50 Z" fill="#E89B3F" />
        <!-- Inner Ears -->
        <path d="M 40 60 L 58 85 L 63 60 Z" fill="#F4D3C4" />
        <path d="M 160 60 L 142 85 L 137 60 Z" fill="#F4D3C4" />

        <!-- White Face Mask (Cheeks and snout area) -->
        <path d="M 40 120 C 40 80, 160 80, 160 120 C 160 160, 120 180, 100 180 C 80 180, 40 160, 40 120" fill="#FFFFFF" />
        
        <!-- Eyebrows (Funny dots) -->
        <circle cx="75" cy="80" r="6" fill="#FFF" />
        <circle cx="125" cy="80" r="6" fill="#FFF" />

        <!-- Eye Whites -->
        <circle cx="75" cy="95" r="10" fill="#FFF" />
        <circle cx="125" cy="95" r="10" fill="#FFF" />
        
        <!-- Pupils (Track text) -->
        <g class="pupils" [style.transform]="eyeTranslation" style="transition: transform 0.1s ease-out">
          <circle cx="72" cy="95" r="5" fill="#333" />
          <circle cx="122" cy="95" r="5" fill="#333" />
        </g>
        
        <!-- Snout / Nose area -->
        <ellipse cx="100" cy="120" rx="15" ry="10" fill="#333" />
        
        <!-- Mouth (Funny smile) -->
        <path d="M 85 135 Q 100 150 115 135" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" />
        
        <!-- Tongue (Visible on focus maybe? Just static cute tongue) -->
        <path d="M 95 140 C 95 155, 105 155, 105 140" fill="#FF7B89" />

        <!-- Paws (hidden initially, raised when hiding eyes) -->
        <g class="arms">
          <path d="M 20 220 Q 40 110 70 100" stroke="#E89B3F" stroke-width="26" stroke-linecap="round" fill="none" class="arm left-arm" />
          <path d="M 180 220 Q 160 110 130 100" stroke="#E89B3F" stroke-width="26" stroke-linecap="round" fill="none" class="arm right-arm" />
          <!-- White Paw pads -->
          <circle cx="70" cy="100" r="12" fill="#FFF" class="left-arm" />
          <circle cx="130" cy="100" r="12" fill="#FFF" class="right-arm" />
        </g>
      </svg>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <h2>Connexion</h2>
      
      <div class="error-banner" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="login">Identifiant</label>
        <input type="text" id="login" name="login" [(ngModel)]="loginData.login" required placeholder="ex: sebastien.pong">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" [(ngModel)]="loginData.password" required 
               (focus)="onPasswordFocus()" (blur)="onPasswordBlur()" placeholder="Votre mot de passe">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>
  </div>
</div>

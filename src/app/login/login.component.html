<div class="login-page">
  <div class="login-container">
    
    <div class="yeti-wrapper" [class.hide-eyes]="isPasswordFocused">
      <svg class="yeti-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Body Hair Back -->
        <path d="M 40 200 C 40 80, 160 80, 160 200" fill="#E6E6E6" />
        
        <!-- Ears -->
        <circle cx="50" cy="110" r="12" fill="#F0C7A6" />
        <circle cx="150" cy="110" r="12" fill="#F0C7A6" />
        
        <!-- Face Mask -->
        <path d="M 60 110 C 60 70, 140 70, 140 110 C 140 150, 100 170, 100 170 C 100 170, 60 150, 60 110" fill="#F0C7A6" />
        
        <!-- Eye Whites -->
        <circle cx="80" cy="95" r="12" fill="#FFF" />
        <circle cx="120" cy="95" r="12" fill="#FFF" />
        
        <!-- Pupils (Track text) -->
        <g class="pupils" [style.transform]="eyeTranslation" style="transition: transform 0.1s ease-out">
          <circle cx="75" cy="95" r="5" fill="#333" />
          <circle cx="115" cy="95" r="5" fill="#333" />
        </g>
        
        <!-- Nose -->
        <ellipse cx="100" cy="110" rx="8" ry="5" fill="#E89B84" />
        
        <!-- Mouth -->
        <path d="M 90 125 Q 100 135 110 125" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />
        
        <!-- Teeth (visible on focus/typing slightly maybe? For now just simple mouth) -->
        <path d="M 92 126 L 95 130 L 98 126 L 102 130 L 105 126 L 108 130" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.8" />

        <!-- Hair Fluffs -->
        <path d="M 90 70 Q 100 50 110 70" stroke="#E6E6E6" stroke-width="4" fill="none" stroke-linecap="round" />
        <path d="M 80 75 Q 90 55 100 75" stroke="#E6E6E6" stroke-width="4" fill="none" stroke-linecap="round" />
        <path d="M 100 75 Q 110 55 120 75" stroke="#E6E6E6" stroke-width="4" fill="none" stroke-linecap="round" />

        <!-- Arms (hidden initially, raised when hiding eyes) -->
        <g class="arms">
          <path d="M 20 220 Q 50 110 80 100" stroke="#E6E6E6" stroke-width="24" stroke-linecap="round" fill="none" class="arm left-arm" />
          <path d="M 180 220 Q 150 110 120 100" stroke="#E6E6E6" stroke-width="24" stroke-linecap="round" fill="none" class="arm right-arm" />
          <!-- Fingers -->
          <g class="fingers" stroke="#E6E6E6" stroke-width="8" stroke-linecap="round">
            <line x1="80" y1="100" x2="85" y2="85" class="left-arm" />
            <line x1="75" y1="95" x2="80" y2="80" class="left-arm" />
            
            <line x1="120" y1="100" x2="115" y2="85" class="right-arm" />
            <line x1="125" y1="95" x2="120" y2="80" class="right-arm" />
          </g>
        </g>
      </svg>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <h2>Connexion</h2>
      
      <div class="error-banner" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="login">Identifiant</label>
        <input type="text" id="login" name="login" [(ngModel)]="loginData.login" required placeholder="ex: sebastien.pong">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" [(ngModel)]="loginData.password" required 
               (focus)="onPasswordFocus()" (blur)="onPasswordBlur()" placeholder="Votre mot de passe">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>
  </div>
</div>

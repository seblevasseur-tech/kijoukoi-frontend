<div class="login-page">
  <div class="login-container">
    
    <div class="yeti-wrapper" [class.hide-eyes]="isPasswordFocused">
      <svg class="yeti-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Monkey Ears -->
        <circle cx="35" cy="100" r="20" fill="#795548" />
        <circle cx="165" cy="100" r="20" fill="#795548" />
        <circle cx="35" cy="100" r="12" fill="#D7CCC8" />
        <circle cx="165" cy="100" r="12" fill="#D7CCC8" />

        <!-- Monkey Back / Head -->
        <circle cx="100" cy="100" r="70" fill="#8D6E63" />
        
        <!-- Monkey Face Mask (Heart-ish shape) -->
        <path d="M 100 130 C 140 180, 170 110, 130 60 C 110 40, 90 40, 70 60 C 30 110, 60 180, 100 130" fill="#D7CCC8" />
        
        <!-- Monkey Muzzle -->
        <ellipse cx="100" cy="130" rx="35" ry="25" fill="#D7CCC8" />
        <path d="M 70 130 Q 100 160 130 130" fill="#D7CCC8" />
        
        <!-- Eyebrows -->
        <path d="M 60 70 Q 75 60 90 75" stroke="#5D4037" stroke-width="4" stroke-linecap="round" fill="none" />
        <path d="M 110 75 Q 125 60 140 70" stroke="#5D4037" stroke-width="4" stroke-linecap="round" fill="none" />

        <!-- Eye Whites -->
        <circle cx="75" cy="95" r="12" fill="#FFF" />
        <circle cx="125" cy="95" r="12" fill="#FFF" />
        
        <!-- Pupils (Track text) -->
        <g class="pupils" [style.transform]="eyeTranslation" style="transition: transform 0.1s ease-out">
          <circle cx="75" cy="95" r="6" fill="#3E2723" />
          <circle cx="125" cy="95" r="6" fill="#3E2723" />
        </g>
        
        <!-- Nose -->
        <ellipse cx="100" cy="120" rx="6" ry="4" fill="#5D4037" />
        
        <!-- Mouth (Monkey smile) -->
        <path d="M 85 135 Q 100 145 115 135" stroke="#5D4037" stroke-width="3" fill="none" stroke-linecap="round" />

        <!-- Arms/Hands (hidden initially, raised when hiding eyes) -->
        <g class="arms">
          <path d="M 20 220 Q 40 110 75 100" stroke="#8D6E63" stroke-width="24" stroke-linecap="round" fill="none" class="arm left-arm" />
          <path d="M 180 220 Q 160 110 125 100" stroke="#8D6E63" stroke-width="24" stroke-linecap="round" fill="none" class="arm right-arm" />
          <!-- Beige Hands -->
          <circle cx="75" cy="100" r="14" fill="#D7CCC8" class="left-arm" />
          <circle cx="125" cy="100" r="14" fill="#D7CCC8" class="right-arm" />
        </g>
      </svg>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <h2>Connexion</h2>
      
      <div class="error-banner" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="login">Identifiant</label>
        <input type="text" id="login" name="login" [(ngModel)]="loginData.login" required placeholder="ex: sebastien.pong">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" [(ngModel)]="loginData.password" required 
               (focus)="onPasswordFocus()" (blur)="onPasswordBlur()" placeholder="Votre mot de passe">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>
  </div>
</div>
